# =====================================================================
# elcm-service - BASE configuration (all environments)
#
# Rules (SDS Step 1):
#   * Product defaults only. No hosts, local paths or secrets here.
#   * Instance values -> environment variables; secrets -> Key Vault secret names.
#   * Profiles: local = developer machine, cloud = every customer instance.
#
# STEP1 removals from the previous base file:
#   - spring.profiles.active (Maven activatedProperties token) and the dataSource.* /
#     encryptor.password Maven tokens (their Maven profiles never defined them)
#   - server.ssl.* (SSLKeystore.p12 + password): TLS ends at the ingress in the
#     cloud; local HTTPS lives in application-local only
#   - jasypt ENC(...) passwords: replaced by Key Vault
#   - p6spy: SQL-logging proxy is local-only (it logs statements with values)
#   - MySQL5Dialect: org.hibernate.dialect.MySQLDialect detects the server version
# =====================================================================

spring.application.name=elcm_service
server.port=${SERVER_PORT:8080}
server.servlet.context-path=/

dodaso.instance.customer-code=${DODASO_CUSTOMER_CODE}
dodaso.instance.display-name=${DODASO_CUSTOMER_NAME}
dodaso.instance.environment=${DODASO_ENVIRONMENT}
dodaso.instance.ecws-base-url=${DODASO_ECWS_BASE_URL}
dodaso.instance.elcm-base-url=${DODASO_ELCM_BASE_URL}
dodaso.instance.auth-issuer-uri=${DODASO_AUTH_ISSUER_URI}

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.generate_statistics=false
spring.jpa.properties.hibernate.jdbc.batch_size=10
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.hibernate.naming.physical-strategy=com.dodaso.ecosystem.baseline.common.PhysicalNamingStrategyImpl

# DataSource: one database login per schema (SDS Step 1 section 5)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://${MYSQL_HOST}:3306/elcm?sslMode=VERIFY_IDENTITY&rewriteBatchedStatements=true&serverTimezone=UTC
spring.datasource.username=${MYSQL_ELCM_USER}
spring.datasource.password=${elcm-db-password}
spring.datasource.type=com.zaxxer.hikari.HikariDataSource
spring.datasource.hikari.poolName=elcm-service-hikariCP
# 10 minutes
spring.datasource.hikari.maxLifetime=600000

# Eureka client (instance addressing is per profile)
eureka.client.service-url.defaultZone=${EUREKA_SERVICE_URL}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
# DISCOVERY TUNING 2026-10-16
#  * registry-fetch-interval-seconds 30 -> 5: how often this app refreshes its local
#    copy of the registry. RESTServiceClient only reads that local copy, so a service
#    that came up after the last fetch stayed invisible for up to 30 s.
#  * instance-info-replication-interval-seconds (default 30) -> 5: how often this app
#    re-checks its health and pushes its own status. An app registers before it is
#    ready (readinessState is OUT_OF_SERVICE then), so it first appears as DOWN and
#    used to stay DOWN for up to 30 s. It also raises the on-demand push allowance
#    from 4 to 24 per minute, so EurekaReadinessStatusPublisher (baseline-common)
#    can push UP the moment the app is ready.
eureka.client.registry-fetch-interval-seconds=5
eureka.client.instance-info-replication-interval-seconds=5
eureka.client.initial-instance-info-replication-interval-seconds=5
eureka.client.healthcheck.enabled=true
eureka.instance.lease-renewal-interval-in-seconds=10
eureka.instance.lease-expiration-duration-in-seconds=30

# Actuator: health (with liveness/readiness) and info only
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.info.build.enabled=true

# JWT. The same value appeared in every app, so it is one shared platform secret.
auth.jwt.header=Authorization
auth.jwt.expiration=30000000
auth.jwt.secret=${platform-jwt-secret}

# Azure Blob. The BlobServiceClient comes from spring-cloud-azure-starter-storage-blob:
# managed identity in the cloud (no key anywhere), account name + key locally.
# STEP1: removed azure.blob.storage.connection / azure.storage.account-key; the key
# that was in these files is compromised and must be rotated.
spring.cloud.azure.storage.blob.endpoint=${AZURE_STORAGE_BLOB_ENDPOINT}

dashboard.insights.metrics.limit=100
dep.wf.defaultType=FINISH_TO_START
dep.wf.enableParent=true
dep.wf.enableSiblingChain=true
dep.wf.minGroupSize=2
elcm.scheduler.ctd.enabled=true
elcm.scheduler.ctd.cron=0 0 * * * *

logging.pattern.level=%5p [${dodaso.instance.customer-code}]
logging.level.root=INFO

# Background extraction of submitted packages (ExtractionWorker). Off until the extractor
# container is running; set ELCM_EXTRACTION_ENABLED=true to turn it on.
elcm.extraction.enabled=${ELCM_EXTRACTION_ENABLED:false}
elcm.extraction.base-url=${ELCM_EXTRACTOR_URL:http://localhost:8088}
# REVISED 2026-10-15 -- 60 s safety net; submit, retry and read again wake the worker at once
elcm.extraction.poll-interval-ms=60000
elcm.extraction.request-timeout-seconds=900
elcm.extraction.max-attempts=2
elcm.extraction.retry-delay-ms=15000
elcm.extraction.stale-minutes=45
# ADDED 2026-10-15 -- how often to look for stale PROCESSING work (the worker still polls for new work every poll-interval-ms)
elcm.extraction.recover-interval-ms=300000

# ADDED 2026-10-16 -- ELCM to ECWS task integration. Off until ELCM_ECWS_ENABLED=true.
# Run elcm_ecws_task_outbox.sql (schema elcm) and ecws_elcm_task_types.sql (schema ecws) first.
elcm.ecws.enabled=${ELCM_ECWS_ENABLED:true}
elcm.ecws.ui-base-url=${ELCM_UI_BASE_URL:https://localhost/elcm}
elcm.ecws.reviewer-role=Reviewer
elcm.ecws.approver-role=Approver
elcm.ecws.poll-interval-ms=15000
elcm.ecws.batch-size=20
elcm.ecws.max-attempts=10


elcm.ecws.base-delay-seconds=30
elcm.ecws.max-delay-seconds=3600
elcm.ecws.claim-timeout-minutes=10

elcm.ecws.due-days.review=2
elcm.ecws.due-days.approval=1
elcm.ecws.due-days.fix=3
elcm.ecws.due-days.failed=1

# ADDED 2026-10-21 - purge of soft-deleted staged documents (StagedDocumentPurgeJob). A purge cannot
# be undone, so the job is off and, once on, only reports until dry-run is set to false.
elcm.purge.enabled=${ELCM_PURGE_ENABLED:false}
elcm.purge.dry-run=${ELCM_PURGE_DRY_RUN:true}
elcm.purge.cron=0 30 2 * * *
elcm.purge.retention-days=${ELCM_PURGE_RETENTION_DAYS:90}
elcm.purge.batch-size=100
# Retention per workspace code, in days. 0 or less keeps that workspace's deleted documents forever.
#elcm.purge.retention-days-by-workspace[RE]=365

# ADDED 2026-10-25: address check behind the Verify address button (demo: Geocodio free tier; USPS also built).
# The keys come from the environment and must never be committed.
elcm.address-verification.enabled=${ELCM_ADDRESS_VERIFY_ENABLED:true}
elcm.address-verification.provider=${ELCM_ADDRESS_VERIFY_PROVIDER:geocodio}
elcm.address-verification.geocodio-base-url=${GEOCODIO_BASE_URL:https://api.geocod.io/v2}
elcm.address-verification.geocodio-api-key=${GEOCODIO_API_KEY:}
elcm.address-verification.usps-base-url=${USPS_BASE_URL:https://apis.usps.com}
elcm.address-verification.usps-client-id=${USPS_CLIENT_ID:}
elcm.address-verification.usps-client-secret=${USPS_CLIENT_SECRET:}
elcm.address-verification.timeout-seconds=8
