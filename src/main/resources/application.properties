# =====================================================================
# elcm-service - BASE configuration (all environments)
#
# Rules (SDS Step 1):
#   * Product defaults only. No hosts, local paths or secrets here.
#   * Instance values -> environment variables; secrets -> Key Vault secret names.
#   * Profiles: local = developer machine, cloud = every customer instance.
#
# STEP1 removals from the previous base file:
#   - spring.profiles.active (Maven activatedProperties token) and the dataSource.* /
#     encryptor.password Maven tokens (their Maven profiles never defined them)
#   - server.ssl.* (SSLKeystore.p12 + password): TLS ends at the ingress in the
#     cloud; local HTTPS lives in application-local only
#   - jasypt ENC(...) passwords: replaced by Key Vault
#   - p6spy: SQL-logging proxy is local-only (it logs statements with values)
#   - MySQL5Dialect: org.hibernate.dialect.MySQLDialect detects the server version
# =====================================================================

spring.application.name=elcm_service
server.port=${SERVER_PORT:8080}
server.servlet.context-path=/

dodaso.instance.customer-code=${DODASO_CUSTOMER_CODE}
dodaso.instance.display-name=${DODASO_CUSTOMER_NAME}
dodaso.instance.environment=${DODASO_ENVIRONMENT}
dodaso.instance.ecws-base-url=${DODASO_ECWS_BASE_URL}
dodaso.instance.elcm-base-url=${DODASO_ELCM_BASE_URL}
dodaso.instance.auth-issuer-uri=${DODASO_AUTH_ISSUER_URI}

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.generate_statistics=false
spring.jpa.properties.hibernate.jdbc.batch_size=10
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.hibernate.naming.physical-strategy=com.dodaso.ecosystem.baseline.common.PhysicalNamingStrategyImpl

# DataSource: one database login per schema (SDS Step 1 section 5)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://${MYSQL_HOST}:3306/elcm?sslMode=VERIFY_IDENTITY&rewriteBatchedStatements=true&serverTimezone=UTC
spring.datasource.username=${MYSQL_ELCM_USER}
spring.datasource.password=${elcm-db-password}
spring.datasource.type=com.zaxxer.hikari.HikariDataSource
spring.datasource.hikari.poolName=elcm-service-hikariCP
# 10 minutes
spring.datasource.hikari.maxLifetime=600000

# Eureka client (instance addressing is per profile)
eureka.client.service-url.defaultZone=${EUREKA_SERVICE_URL}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.registry-fetch-interval-seconds=30
eureka.client.initial-instance-info-replication-interval-seconds=5
eureka.client.healthcheck.enabled=true
eureka.instance.lease-renewal-interval-in-seconds=10
eureka.instance.lease-expiration-duration-in-seconds=30

# Actuator: health (with liveness/readiness) and info only
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.info.build.enabled=true

# JWT. The same value appeared in every app, so it is one shared platform secret.
auth.jwt.header=Authorization
auth.jwt.expiration=30000000
auth.jwt.secret=${platform-jwt-secret}

# Azure Blob. The BlobServiceClient comes from spring-cloud-azure-starter-storage-blob:
# managed identity in the cloud (no key anywhere), account name + key locally.
# STEP1: removed azure.blob.storage.connection / azure.storage.account-key; the key
# that was in these files is compromised and must be rotated.
spring.cloud.azure.storage.blob.endpoint=${AZURE_STORAGE_BLOB_ENDPOINT}

dashboard.insights.metrics.limit=100
dep.wf.defaultType=FINISH_TO_START
dep.wf.enableParent=true
dep.wf.enableSiblingChain=true
dep.wf.minGroupSize=2
elcm.scheduler.ctd.enabled=true
elcm.scheduler.ctd.cron=0 0 * * * *

logging.pattern.level=%5p [${dodaso.instance.customer-code}]
logging.level.root=INFO
