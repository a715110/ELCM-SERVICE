# =====================================================================
# elcm-service - LOCAL profile (developer machine only; never deployed)
#
# Keystores live outside the project (shared by all dodaso apps):
#   ${user.home}/.dodaso/certs/dodaso_keystore.p12 and dodaso_truststore.p12
# Override the folder with DODASO_CERT_DIR.
#
# Database password: set MYSQL_DEV_PASSWORD (the adev "developer" login).
# Secret defaults below are dev-only values.
# =====================================================================

dodaso.local.cert-dir=${DODASO_CERT_DIR:${user.home}/.dodaso/certs}

dodaso.instance.customer-code=local
dodaso.instance.display-name=Local Dev
dodaso.instance.environment=local
dodaso.instance.ecws-base-url=https://localhost/ecws
dodaso.instance.elcm-base-url=https://localhost/elcm
dodaso.instance.auth-issuer-uri=https://localhost:8081

server.port=8442
server.ssl.enabled=true
server.ssl.key-store-type=PKCS12
server.ssl.key-store=file:${dodaso.local.cert-dir}/dodaso_keystore.p12
server.ssl.key-store-password=changeit
server.ssl.key-alias=dodaso-server

# DataSource: p6spy SQL logging, shared adev database
spring.datasource.driver-class-name=com.p6spy.engine.spy.P6SpyDriver
spring.datasource.url=jdbc:p6spy:mysql://adev.mysql.database.azure.com:3306/elcm?createDatabaseIfNotExist=true&rewriteBatchedStatements=true&useSSL=true&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=developer
elcm-db-password=HopeComeTrue2025Finally!
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.generate_statistics=true
logging.level.org.hibernate.stat=info

# Same value as before so local tokens keep working. It has been in git:
# local development only.
platform-jwt-secret=${PLATFORM_JWT_SECRET:9a4f2c8d3b7a1e6f45c8a0b3f267d8b1d4e6f3c8a9d2b5f8e3a9c8b5f6v8a3d9}

# Eureka (local HTTPS registry). STEP1: the registered port now follows
# server.port. Before, several services registered 8443 or 443 regardless of
# the port they actually listened on.
eureka.client.service-url.defaultZone=https://localhost:9443/eureka/
eureka.client.tls.enabled=true
eureka.client.tls.trust-store=file:${dodaso.local.cert-dir}/dodaso_truststore.p12
eureka.client.tls.trust-store-password=changeit
eureka.client.tls.trust-store-type=PKCS12
eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=false
eureka.instance.secure-port-enabled=true
eureka.instance.secure-port=${server.port}
eureka.instance.non-secure-port-enabled=false
eureka.instance.status-page-url=https://localhost:${server.port}/actuator/info
eureka.instance.health-check-url=https://localhost:${server.port}/actuator/health
eureka.instance.home-page-url=https://localhost:${server.port}/

# Blob (local): account key auth. Set AZURE_STORAGE_ACCOUNT_KEY to the ROTATED key.
spring.cloud.azure.storage.blob.endpoint=https://adevblobstorageuser.blob.core.windows.net
spring.cloud.azure.storage.blob.account-name=adevblobstorageuser
spring.cloud.azure.storage.blob.account-key=${AZURE_STORAGE_ACCOUNT_KEY}